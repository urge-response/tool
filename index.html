<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102f40"><title>4 Steps + 1 · Addiction Urge Tool</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#173746;background:#f3f7f7}*{box-sizing:border-box}body{margin:0}button,textarea,input{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #4ca9aa;outline-offset:3px}.app{max-width:530px;min-height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 30px #1233}.top{background:#102f40;color:white;padding:calc(18px + env(safe-area-inset-top)) 24px 25px;border-radius:0 0 26px 26px}.brand{font-size:.83rem;letter-spacing:.08em;font-weight:700;color:#b4d7d7;text-transform:uppercase}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.homeicon{border:1px solid #55717e;border-radius:12px;color:white;background:transparent;padding:8px 12px}.top h1{font-size:1.65rem;letter-spacing:-.035em;line-height:1.2;margin:19px 0 7px}.top p{color:#d0e1e5;line-height:1.5;margin:0;font-size:.94rem}.content{padding:25px 22px 35px;flex:1}.eyebrow{color:#0a7f81;font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.lead{font-size:1.25rem;font-weight:750;line-height:1.35;margin:8px 0 13px}.description{line-height:1.65;color:#48616d;margin:0 0 20px}.quote{border-left:4px solid #0a8b88;background:#edf8f6;padding:15px 17px;border-radius:0 13px 13px 0;color:#234e52;line-height:1.6;margin:18px 0 24px}.question{font-weight:700;margin:22px 0 10px;line-height:1.45}.help{font-size:.82rem;color:#607780;margin:6px 0 10px}.field{width:100%;min-height:115px;border:1.5px solid #cbdcde;border-radius:14px;background:#fafcfc;padding:14px;resize:vertical;color:#173746}.rangebox{padding:18px;background:#f2f8f8;border:1px solid #d8e8e8;border-radius:16px}.rangerow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.rating{font-size:1.5rem;color:#087d7e;font-weight:800}.rangebox input{width:100%;accent-color:#087d7e}.rangeends{display:flex;justify-content:space-between;font-size:.78rem;color:#627984}.progress{display:flex;gap:6px;margin-top:20px}.segment{height:5px;background:#426171;flex:1;border-radius:5px}.segment.active{background:#5dd1c5}.segment.done{background:#a0e4db}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:28px}.btn{border:0;border-radius:13px;padding:14px 17px;font-weight:750;min-height:48px}.primary{background:#087e80;color:white;flex:1}.secondary{background:#eaf1f2;color:#254b58}.outline{background:transparent;border:1px solid #cadbdc;color:#37545f}.start{width:100%;margin-top:12px}.card{background:#f5f9f9;border:1px solid #dce9e9;border-radius:18px;padding:19px;margin:20px 0}.card h3{margin:0 0 7px;font-size:1rem}.card p{margin:0;color:#536b74;line-height:1.55;font-size:.9rem}.bottom{padding:12px 22px calc(16px + env(safe-area-inset-bottom));border-top:1px solid #e7eeee;color:#70858b;font-size:.74rem;line-height:1.5}.toast{font-size:.86rem;color:#087d7e;margin-top:12px;min-height:1.3em}.review{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem;line-height:1.55;background:#f3f8f8;padding:14px;border-radius:12px} @media(min-width:600px){body{padding:20px}.app{border-radius:25px;overflow:hidden;min-height:calc(100dvh - 40px)}}@media(prefers-reduced-motion:no-preference){.content{animation:appear .2s ease}@keyframes appear{from{opacity:.6;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}}
.navrow{display:flex;gap:8px;margin-top:17px}.navbtn{flex:1;border:1px solid #456474;border-radius:12px;background:#244758;color:#fff;padding:10px;font-weight:700}.navbtn[aria-current="page"]{background:#087e80;border-color:#65c5c1}.history-item{border:1px solid #dce9e9;border-radius:15px;padding:16px;margin:12px 0;background:#f7fafa}.history-item h3{margin:0 0 5px;font-size:1rem}.history-item p{margin:0 0 12px;color:#526b73;font-size:.88rem}.history-actions{display:flex;gap:8px;flex-wrap:wrap}.history-actions .btn{min-height:42px;padding:9px 12px;font-size:.88rem}.danger{background:#fff0f0;color:#8b2525}.notice{padding:12px 14px;background:#edf8f6;border-radius:12px;color:#27565a;font-size:.87rem;line-height:1.5}.muted{color:#607780;font-size:.87rem}.saved-status{font-size:.8rem;color:#b4d7d7;margin-top:8px} </style></head><body><div class="app"><header class="top"><div class="topline"><div class="brand">4 STEPS + 1: Addiction Urge Response</div><button class="homeicon" id="home" type="button" aria-label="Return to home">⌂ Home</button></div><h1 id="headerTitle">Addiction Urge Tool</h1><p id="headerDesc">A space to pause, reflect, and choose what happens next.</p><div id="progress" class="progress" hidden></div><div id="saveState" class="saved-status" role="status"></div><nav class="navrow" aria-label="App navigation"><button type="button" class="navbtn" data-nav="home">Home</button><button type="button" class="navbtn" data-nav="checkin">Check-in</button><button type="button" class="navbtn" data-nav="history">History</button></nav></header><main id="content" class="content" aria-live="polite"></main><footer class="bottom">A self-help reflection tool, not a substitute for professional support. If you may be in immediate danger, seek local emergency assistance.</footer></div><script>
'use strict';const data={intensity:5,urge:'',trigger:'',need:'',activity:'',impact:'',values:'',actions:''};let page=-1;const stages=[{name:'Relabel',desc:'Notice that what you’re feeling is just a thought or urge, and that it itself isn’t a real, objective need.',example:'“I’m noticing an urge to engage in an addictive behaviour. This is an urge and not a need that I must act on. I can choose what happens next.”'},{name:'Reattribute',desc:'Acknowledge that the urge is a pattern in your brain. Understand that this urge represents an unsatisfied need and may be triggered by feeling unhappy, tired, stressed, or bored.',example:'“My brain learned to associate this behaviour with relief or reward. I can recognize this and what triggered it without acting on it.”'},{name:'Refocus',desc:'Even though your urge might feel powerful, it will fade away with time. Instead of acting on the urge or shaming yourself for it, consider what you need right now.'},{name:'Revalue',desc:'Often our urges make addictive behaviours feel like the highest priority, even to the point that the things we care about are neglected.'},{name:'Recreate',desc:'Now that you’ve put in the work to not act on your urge, consider: what life do I want to create for myself now?'}];const $=id=>document.getElementById(id);
const DRAFT_KEY='urge_response_draft_v1', HISTORY_KEY='urge_response_history_v1';
const blank=()=>({intensity:5,urge:'',trigger:'',need:'',activity:'',impact:'',values:'',actions:''});
let view='home', selectedEntry=null, storageOK=true, draftExists=false, lastSaveError='';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]))}
function readStore(key,fallback){try{const raw=localStorage.getItem(key);return raw===null?fallback:JSON.parse(raw)}catch(e){storageOK=false;lastSaveError='Local storage is unavailable. Copy your responses to keep them.';return fallback}}
function writeStore(key,value){try{localStorage.setItem(key,JSON.stringify(value));storageOK=true;lastSaveError='';return true}catch(e){storageOK=false;lastSaveError='Could not save on this device. Copy your responses before leaving.';updateSaveState();return false}}
function removeStore(key){try{localStorage.removeItem(key);storageOK=true;lastSaveError='';return true}catch(e){storageOK=false;lastSaveError='Could not clear saved data.';updateSaveState();return false}}
function hasContent(d){return Object.keys(blank()).some(k=>k!=='intensity' && String(d[k]||'').trim()!=='') || d.intensity!==5}
function restoreDraft(){const raw=readStore(DRAFT_KEY,null);if(raw && typeof raw==='object' && raw.answers && typeof raw.answers==='object'){Object.assign(data,blank(),raw.answers);data.intensity=Math.max(0,Math.min(10,Number(data.intensity)||0));page=Number.isInteger(raw.page)?Math.max(0,Math.min(4,raw.page)):0;draftExists=true;return true}return false}
function saveDraft(){if(!hasContent(data)&&page===0&&!draftExists)return;draftExists=writeStore(DRAFT_KEY,{answers:{...data},page,updatedAt:new Date().toISOString()});updateSaveState()}
function updateSaveState(){const node=$('saveState');if(!node)return;node.textContent=lastSaveError||(view==='checkin'&&draftExists?'Draft saved on this device':'')}
function getHistory(){const raw=readStore(HISTORY_KEY,[]);return Array.isArray(raw)?raw.filter(x=>x&&typeof x==='object'&&x.id&&x.answers):[]}
function field(key,label,placeholder='Write your thoughts here...'){return `<label class="question" for="${key}">${label}</label><textarea class="field" id="${key}" data-key="${key}" placeholder="${placeholder}">${esc(data[key])}</textarea>`}
function buttons(){return `<div class="actions"><button type="button" class="btn secondary" data-action="restart">Start over</button>${page>0?'<button type="button" class="btn secondary" data-action="back">← Back</button>':''}${page<4?'<button type="button" class="btn primary" data-action="next">Continue →</button>':'<button type="button" class="btn primary" data-action="save">Save check-in</button>'}</div>${page===4?'<div class="actions"><button type="button" class="btn outline" data-action="copy">Copy my responses</button><button type="button" class="btn outline" data-action="discard">Discard draft</button></div>':''}<p id="status" class="toast" role="status"></p>`}
function summary(d=data){return `4 Steps + 1: Addiction Urge Response\n\n1. Relabel\nUrge intensity: ${d.intensity}/10\nDescription: ${d.urge||'—'}\n\n2. Reattribute\nPossible cause: ${d.trigger||'—'}\n\n3. Refocus\nCurrent need: ${d.need||'—'}\n10–15 minute activity: ${d.activity||'—'}\n\n4. Revalue\nImpact of acting on the urge: ${d.impact||'—'}\n\n+1. Recreate\nValues and what matters: ${d.values||'—'}\nValues-aligned actions: ${d.actions||'—'}`}
function dateLabel(date){const d=new Date(date);return Number.isNaN(d.getTime())?'Date unavailable':d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}
function render(){const home=view==='home', history=view==='history', detail=view==='detail', checkin=view==='checkin';
$('headerTitle').textContent=home?'Addiction Urge Tool':history?'Check-in history':detail?'Saved reflection':`${page===4?'+1':page+1}. ${stages[page].name}`;
$('headerDesc').textContent=home?'A space to pause, reflect, and choose what happens next.':history?'Your reflections, saved on this device.':detail?'Review or copy your saved responses.':'Take your time. You can go back or start over at any point.';
$('progress').hidden=!checkin;$('progress').innerHTML=checkin?stages.map((s,i)=>`<span class="segment ${i===page?'active':i<page?'done':''}" aria-label="Step ${i+1}: ${esc(s.name)}"></span>`).join(''):'';
$('home').hidden=home;document.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-current',b.dataset.nav===view?'page':'false'));
let html='';
if(home){html=`<div class="eyebrow">Welcome</div><h2 class="lead">You don't have to act on an urge immediately.</h2><p class="description">Use this guided reflection to notice an urge, explore what may be behind it, and choose a response that fits your needs and values.</p><div class="card"><h3>Five guided stages</h3><p>Relabel → Reattribute → Refocus → Revalue → Recreate. No account required. Drafts are saved on this device; completed entries are saved only if you choose.</p></div>${draftExists?'<div class="notice">You have an unfinished check-in saved on this device.</div><button class="btn primary start" data-action="resume">Resume draft →</button><button class="btn secondary start" data-action="new">Start a new check-in</button>':'<button class="btn primary start" data-action="start">Begin a check-in →</button>'}<button class="btn outline start" data-action="history">View saved check-ins (${getHistory().length})</button>`}
else if(history){const entries=getHistory().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));html=`<div class="eyebrow">History</div><h2 class="lead">Saved check-ins</h2><p class="description">Only check-ins you explicitly saved appear here. Deleting a saved entry cannot be undone.</p>`+(entries.length?entries.map(e=>`<article class="history-item"><h3>${esc(dateLabel(e.createdAt))}</h3><p>Urge intensity: ${esc(e.answers.intensity)}/10</p><div class="history-actions"><button class="btn primary" data-action="view" data-id="${esc(e.id)}">View</button><button class="btn danger" data-action="delete" data-id="${esc(e.id)}">Delete</button></div></article>`).join(''):'<div class="card"><h3>No saved check-ins yet</h3><p>When you finish a check-in, choose “Save check-in” to keep it here.</p></div>')}
else if(detail){const e=getHistory().find(x=>x.id===selectedEntry);if(!e){view='history';return render()}html=`<div class="eyebrow">Saved ${esc(dateLabel(e.createdAt))}</div><div class="review">${esc(summary(e.answers))}</div><div class="actions"><button class="btn secondary" data-action="history">← History</button><button class="btn primary" data-action="copy-entry" data-id="${esc(e.id)}">Copy responses</button><button class="btn danger" data-action="delete" data-id="${esc(e.id)}">Delete</button></div><p id="status" class="toast" role="status"></p>`}
else if(checkin){const s=stages[page];html=`<div class="eyebrow">Step ${page+1} of 5</div><p class="description" style="margin-top:14px">${esc(s.desc)}</p>${s.example?`<div class="quote">${esc(s.example)}</div>`:''}`;
if(page===0)html+=`<label class="question" for="intensity">How strong is the urge right now?</label><div class="rangebox"><div class="rangerow"><span>Urge intensity</span><span class="rating" id="rating">${data.intensity}/10</span></div><input id="intensity" type="range" min="0" max="10" step="1" value="${data.intensity}" aria-label="Urge intensity from zero to ten"><div class="rangeends"><span>0 · None</span><span>10 · Extremely strong</span></div></div>`+field('urge','Describe the urge and how it feels mentally and physically.');
if(page===1)html+=field('trigger','What might have caused this urge?');
if(page===2)html+=field('need','What do you need right now?')+field('activity','What could you do for 10–15 minutes to meet that need?')+`<div class="card"><h3>Tip</h3><p>If you struggle to identify your need, consider an activity that you enjoy or an activity you find distracting.</p></div>`;
if(page===3)html+=field('impact','Reflecting on the facts, what impact does acting on the urge have on your life?');
if(page===4)html+=`<p class="description">To do this, it can be helpful to consider your values, what you care about, and what you find meaningful.</p>`+field('values','Take a moment to write down some of your values and what you find meaningful.')+field('actions','What behaviours or actions could you do that are aligned with those values?');html+=buttons()}
$('content').innerHTML=html;updateSaveState();
document.querySelectorAll('textarea[data-key]').forEach(t=>t.addEventListener('input',()=>{data[t.dataset.key]=t.value;saveDraft()}));const r=$('intensity');if(r)r.addEventListener('input',()=>{data.intensity=Number(r.value);$('rating').textContent=`${data.intensity}/10`;saveDraft()});document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action,b.dataset.id)))}
function nav(n){page=n;view='checkin';saveDraft();render();window.scrollTo(0,0)}
function clearDraft(){if(!removeStore(DRAFT_KEY))return false;Object.assign(data,blank());draftExists=false;page=0;return true}
function newCheckin(){if(draftExists&&!confirm('Discard the unfinished draft and start a new check-in?'))return;if(!clearDraft())return;nav(0)}
function saveEntry(){const entries=getHistory();const entry={id:(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`,createdAt:new Date().toISOString(),answers:{...data}};if(!writeStore(HISTORY_KEY,[entry,...entries])){$('status').textContent=lastSaveError;return}if(!clearDraft()){$('status').textContent='Check-in saved, but the draft could not be cleared.';return}view='history';render()}
function deleteEntry(id){if(!confirm('Permanently delete this saved check-in?'))return;const entries=getHistory();if(!writeStore(HISTORY_KEY,entries.filter(e=>e.id!==id)))return;selectedEntry=null;view='history';render()}
function action(a,id){if(a==='start'||a==='resume'){nav(draftExists?page:0)}else if(a==='new')newCheckin();else if(a==='next')nav(Math.min(page+1,4));else if(a==='back')nav(Math.max(page-1,0));else if(a==='restart'||a==='discard'){if(confirm('Discard this unfinished check-in and clear its draft?')&&clearDraft()){view='home';render()}}else if(a==='save')saveEntry();else if(a==='copy')copyResponses(summary());else if(a==='copy-entry'){const e=getHistory().find(x=>x.id===id);if(e)copyResponses(summary(e.answers))}else if(a==='history'){view='history';render()}else if(a==='view'){selectedEntry=id;view='detail';render()}else if(a==='delete')deleteEntry(id)}
async function copyResponses(s){try{await navigator.clipboard.writeText(s);$('status').textContent='Responses copied to clipboard.'}catch(e){const box=document.createElement('textarea');box.className='field';box.value=s;box.setAttribute('aria-label','Your responses, select to copy');$('status').replaceWith(box);box.focus();box.select();try{document.execCommand('copy')}catch(_){} }}
$('home').addEventListener('click',()=>{view='home';render()});document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.nav==='home')view='home';else if(b.dataset.nav==='history')view='history';else if(b.dataset.nav==='checkin'){if(!draftExists&&view!=='checkin'){Object.assign(data,blank());page=0}view='checkin'}render()}));
restoreDraft();render();
</script></body></html>
