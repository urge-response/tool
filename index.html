<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Urge Response Decision Tree</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light dark}body{margin:0;background:#eef4f5;color:#173044}main{max-width:680px;margin:24px auto;padding:18px}header{background:#15354c;color:white;padding:24px;border-radius:18px}header p{color:#d2e4e9}.panel{background:white;border:1px solid #d4e0e3;border-radius:16px;padding:22px;margin-top:16px;box-shadow:0 3px 15px #1730440b}h1{font-size:1.6rem;margin:0}h2{margin:0 0 12px;font-size:1.25rem}p{line-height:1.55}.muted{color:#526878}.choices{display:grid;gap:10px;margin-top:18px}button{font:inherit;text-align:left;border:1px solid #c9d8dc;border-radius:12px;padding:14px;background:#f7fbfb;color:#15354c;cursor:pointer}button:hover,button:focus-visible{border-color:#078b91;background:#e6f5f4}button.primary{background:#087d83;color:white;border-color:#087d83}button.secondary{background:white}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}nav button{padding:9px 12px}.tag{font-size:.8rem;color:#087d83;font-weight:700;letter-spacing:.04em;text-transform:uppercase}.notice{background:#e9f6f4;padding:14px;border-radius:10px}.crumb{font-size:.88rem;color:#526878;margin-top:12px}label{display:block;margin:10px 0 6px}input[type=range]{width:100%}textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #b9cdd1;font:inherit}footer{font-size:.86rem;color:#526878;margin:20px 0}@media(prefers-color-scheme:dark){body{background:#10212b;color:#eaf3f5}.panel{background:#1b303b;border-color:#38505b}button,button.secondary{background:#243c47;color:#edf7f8;border-color:#48616b}button:hover,button:focus-visible{background:#25535a}.muted,.crumb,footer{color:#afc5ce}.notice{background:#214b4c}textarea{background:#243c47;color:white}} </style></head><body><main><header><h1>My Urge Response Tool</h1><p>A nonjudgmental guide to understand what I need, choose how to respond, and check in again.</p></header><section class="panel" id="app" aria-live="polite"></section><footer>Sexual desire is normal. This tool supports choice and flexibility, not suppression or shame. It is not a substitute for professional support.</footer></main><script>
const needs={calm:{name:'Relaxation / stress relief',activities:['Try slow breathing for 3 minutes','Do 10 minutes of yoga or qigong','Take a warm shower','Practice progressive muscle relaxation']},stim:{name:'Stimulation / boredom',activities:['Take a brisk walk','Do a short workout or heavy-bag session','Play a challenging game','Work on a creative project']},connect:{name:'Connection / intimacy',activities:['Message or call someone','Spend intentional time with a loved one','Ask for a hug or cuddle, if welcome','Write down what kind of connection I want']},comfort:{name:'Comfort / difficult emotions',activities:['Make tea and sit somewhere comfortable','Listen to comforting music','Write down what I am feeling','Talk to someone supportive']},escape:{name:'Escape / avoidance',activities:['Read fiction for 10 minutes','Change rooms or go outside','Do one tiny step of the task I am avoiding','Use a grounding exercise']},validation:{name:'Validation / self-worth',activities:['Practice a skill I value','List three qualities I appreciate about myself','Connect with someone who values me','Do something aligned with my values']},rest:{name:'Rest / exhaustion',activities:['Lie down without my phone','Take a short nap','Put on a relaxing audiobook','Start my bedtime routine']},sexual:{name:'Sexual desire / pleasure',activities:['Allow the desire to exist without acting immediately','Practice urge surfing','Choose a different pleasurable activity','Reflect on whether any sexual choice would be intentional and aligned with my values']}};
let page='start',history=[],need=null,chosen='',before=5,after=5,custom='';const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(p){history.push(page);page=p;render()}function back(){if(history.length){page=history.pop();render()}}function home(){history=[];page='start';need=null;chosen='';render()}function buttons(arr){return '<div class="choices">'+arr.map(([t,p])=>`<button data-go="${p}">${esc(t)}</button>`).join('')+'</div>'}function nav(){return `<nav>${history.length?'<button class="secondary" data-back="1">← Back</button>':''}<button class="secondary" data-home="1">Start over</button></nav>`}function render(){let s='';if(page==='start')s=`<span class="tag">Step 1 · Notice</span><h2>Am I experiencing an urge I want help responding to?</h2><p class="muted">Having an urge is not the same as choosing to act on it.</p>${buttons([['Yes — help me pause','pause'],['Not right now — I want to plan ahead','needs']])}`;if(page==='pause')s=`<span class="tag">Step 2 · Pause</span><h2>Can I pause and check in?</h2><p>Put some space between the urge and your next action. If helpful, set down your phone, change rooms, or take a few breaths.</p>${buttons([['Yes — identify what I need','needs'],['The urge feels too strong — help me ride it out','surf'],['I am unsure what I am feeling','unsure']])}`;if(page==='unsure')s=`<span class="tag">Grounding</span><h2>It is okay not to know yet</h2><p>Notice your feet on the floor. Name five things you see. Ask: am I tired, tense, lonely, bored, upset, or seeking pleasure?</p>${buttons([['Try identifying a need','needs'],['Try urge surfing first','surf']])}`;if(page==='needs')s=`<span class="tag">Step 3 · Identify</span><h2>What am I hoping to get from acting on the urge?</h2><p class="muted">Choose the closest fit. More than one need can be present.</p><div class="choices">${Object.entries(needs).map(([k,v])=>`<button data-need="${k}">${esc(v.name)}</button>`).join('')}<button data-go="unsure">I'm not sure</button></div>`;if(page==='activities')s=`<span class="tag">Step 4 · Respond</span><h2>What could help meet my need for ${esc(needs[need].name.toLowerCase())}?</h2><div class="choices">${needs[need].activities.map((a,i)=>`<button data-activity="${i}">${esc(a)}</button>`).join('')}<button data-custom="1">Choose my own activity</button><button data-go="needs">Try a different need</button></div>`;if(page==='custom')s=`<h2>Choose my own activity</h2><label for="custom">What will I try?</label><textarea id="custom" rows="3" placeholder="A small, realistic action..."></textarea><div class="choices"><button class="primary" data-savecustom="1">Use this activity</button></div>`;if(page==='plan')s=`<span class="tag">Step 4 · Make a plan</span><h2>My next 10 minutes</h2><div class="notice"><strong>My chosen activity:</strong><p>${esc(chosen)}</p></div><label for="before">How strong is the urge right now? <strong id="bv">${before}/10</strong></label><input id="before" type="range" min="0" max="10" value="${before}"><p class="muted">I can experience an urge without obeying it. I don't have to make it disappear.</p>${buttons([['I tried it — check in','check'],['I want to try urge surfing instead','surf'],['Choose another activity','activities']])}`;if(page==='surf')s=`<span class="tag">Urge surfing</span><h2>Let the urge rise and fall</h2><p>For a few minutes, observe the urge with curiosity. Where do you feel it? Is it changing? Breathe normally, relax what you can, and return attention to your surroundings. You do not need to fight it or act on it.</p><p class="notice">If the urge stays strong, that is okay. Success means practicing choice, not forcing the urge away.</p>${buttons([['Now identify my need','needs'],['I tried this — check in','check']])}`;if(page==='check')s=`<span class="tag">Step 5 · Reassess</span><h2>How am I doing now?</h2><label for="after">Urge intensity now: <strong id="av">${after}/10</strong></label><input id="after" type="range" min="0" max="10" value="${after}"><p>Did I meet my underlying need, even partly?</p>${buttons([['Yes — I can continue my day','finish'],['Partly — try another activity','activities'],['No — reconsider the need','needs'],['I still need help tolerating the urge','surf']])}`;if(page==='finish')s=`<span class="tag">Reflection</span><h2>I made an intentional choice</h2><p>Urges can come back. I can repeat this process whenever useful, without judging myself.</p><div class="notice"><p><strong>Need:</strong> ${need?esc(needs[need].name):'Not identified'}</p><p><strong>Activity:</strong> ${chosen?esc(chosen):'Urge surfing / grounding'}</p><p><strong>Urge rating:</strong> ${before}/10 initially; ${after}/10 at check-in</p></div><div class="choices"><button data-copy="1">Copy this reflection</button><button data-home="1">Begin again</button></div>`;app.innerHTML=s+nav();app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));app.querySelectorAll('[data-need]').forEach(b=>b.onclick=()=>{need=b.dataset.need;go('activities')});app.querySelectorAll('[data-activity]').forEach(b=>b.onclick=()=>{chosen=needs[need].activities[+b.dataset.activity];go('plan')});app.querySelectorAll('[data-custom]').forEach(b=>b.onclick=()=>go('custom'));app.querySelectorAll('[data-savecustom]').forEach(b=>b.onclick=()=>{let v=document.getElementById('custom').value.trim();if(v){chosen=v;go('plan')}});app.querySelectorAll('[data-back]').forEach(b=>b.onclick=back);app.querySelectorAll('[data-home]').forEach(b=>b.onclick=home);app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{let t=`Need: ${need?needs[need].name:'Not identified'}\nActivity: ${chosen||'Urge surfing / grounding'}\nUrge: ${before}/10 to ${after}/10`;navigator.clipboard?.writeText(t).then(()=>b.textContent='Copied').catch(()=>prompt('Copy this reflection:',t))});let x=document.getElementById('before');if(x)x.oninput=()=>{before=+x.value;document.getElementById('bv').textContent=before+'/10'};x=document.getElementById('after');if(x)x.oninput=()=>{after=+x.value;document.getElementById('av').textContent=after+'/10'}}render();
</script></body></html>
